# ---------------------------------------------------------------------------
# Plugins & defaults
# ---------------------------------------------------------------------------
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  posts_limit: 30

defaults:
  - scope: { path: "" }
    values: { image: /assets/img/og.jpg }
  - scope: { path: "", type: "posts" }
    values: { layout: article }
  - scope: { path: "", type: "pages" }
    values: { layout: page }
  - scope: { path: "", type: "articles" }
    values: { layout: article }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - vendor
  - node_modules
  - .github
