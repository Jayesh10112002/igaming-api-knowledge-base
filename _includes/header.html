<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="iGaming API Knowledge Base — home">
      <img src="{{ '/assets/img/logo.svg' | relative_url }}" alt="Betnex — iGaming API Knowledge Base" width="132" height="25">
    </a>
    <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="primary-nav" aria-label="Toggle navigation menu">
      <span></span><span></span><span></span>
    </button>
    <nav id="primary-nav" class="primary-nav" aria-label="Primary">
      <a href="{{ '/casino-api/' | relative_url }}"{% if page.url contains '/casino-api' %} class="is-active" aria-current="page"{% endif %}>Casino API</a>
      <a href="{{ '/slots-api/' | relative_url }}"{% if page.url contains '/slots-api' %} class="is-active" aria-current="page"{% endif %}>Slots API</a>
      <a href="{{ '/live-casino/' | relative_url }}"{% if page.url contains '/live-casino' %} class="is-active" aria-current="page"{% endif %}>Live Casino</a>
      <a href="{{ '/sportsbook/' | relative_url }}"{% if page.url contains '/sportsbook' %} class="is-active" aria-current="page"{% endif %}>Sportsbook</a>
      <a href="{{ '/engineering/' | relative_url }}"{% if page.url contains '/engineering' %} class="is-active" aria-current="page"{% endif %}>Engineering</a>
      <a href="{{ '/resources/' | relative_url }}"{% if page.url contains '/resources' %} class="is-active" aria-current="page"{% endif %}>Resources</a>
      <a class="nav-cta" href="{{ site.casino_api_url }}" target="_blank" rel="noopener">Get API access</a>
    </nav>
  </div>
</header>
<script>
  (function () {
    var toggle = document.getElementById("nav-toggle");
    var nav = document.getElementById("primary-nav");
    if (!toggle || !nav) return;
    toggle.addEventListener("click", function () {
      var open = nav.classList.toggle("is-open");
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
    });
    nav.addEventListener("click", function (e) {
      if (e.target.tagName === "A") { nav.classList.remove("is-open"); toggle.setAttribute("aria-expanded", "false"); }
    });
  })();
</script>
